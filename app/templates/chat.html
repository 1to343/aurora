{% extends "base.html" %}
{% block title %}Чат{% endblock %}
{% block content %}
<div class="hero-bar">
  <div class="hero-canvas-wrap"><canvas id="hero-canvas"></canvas></div>
  <div class="hero-text">
    <h2><i class="bi bi-chat-dots me-2" style="color:var(--accent-orange)"></i>Корпоративный чат</h2>
    <p>Сотрудники цеха и офиса · системные оповещения · live-обновление</p>
  </div>
  <div class="ms-auto">
    <small id="chat-status" style="color:var(--text-muted)"><i class="bi bi-circle-fill me-1" style="font-size:.5rem"></i>подключение...</small>
  </div>
</div>

<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card" style="overflow:hidden">
      <div id="messages" style="height:560px;overflow-y:auto;padding:1rem;background:rgba(10,14,26,.4)"></div>
      <div class="card-footer" style="border-top:1px solid var(--border-glass);padding:.75rem 1rem">
        <form id="send-form" class="d-flex gap-2">
          <input class="form-control" id="msg-input" placeholder="" autocomplete="off" required>
          <button class="btn btn-primary" style="min-width:130px"><i class="bi bi-send me-1"></i>Отправить</button>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  .chat-msg {
    margin-bottom:.55rem; padding:.6rem .85rem; border-radius:10px;
    background: var(--bg-card); border: 1px solid var(--border-glass);
    animation: msg-in .35s cubic-bezier(.2,.8,.2,1);
    transition: border-color .15s;
  }
  .chat-msg:hover { border-color: var(--border-glass-strong); }
  .chat-msg.mine { border-left: 3px solid var(--accent-cyan); }
  .chat-msg.system { border-left: 3px solid var(--accent-orange); background: rgba(255,184,107,.04); }
  .chat-msg .meta { font-size:.75rem; color: var(--text-muted); margin-bottom:.2rem; display:flex; gap:.5rem; align-items:center; font-family: var(--font-mono); }
  .chat-msg .meta .name { font-weight:600; color: var(--text-primary); }
  .chat-msg.mine .meta .name { color: var(--accent-cyan); }
  .chat-msg.system .meta .name { color: var(--accent-orange); }
  .chat-msg .meta .role { color: var(--accent-cyan); font-size:.7rem; }
  .chat-msg.system .meta .role { color: var(--accent-orange); }
  .chat-msg .body { white-space:pre-wrap; word-break:break-word; color: var(--text-primary); font-size:.9rem; line-height:1.45; }
  @keyframes msg-in { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  #msg-input { animation: ph-shift 8s linear infinite; }
  @keyframes placeholder-pulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
</style>
{% endblock %}

{% block scripts %}
<script>
startPolyhedron('hero-canvas','tetrahedron',{speed:1.6, scale:32});

const currentUserId = {{ user.id }};
let lastId = 0;
let systemSeen = new Set();

const placeholders = [
  'Введите сообщение...',
  'Что нового на смене?',
  'Сообщить о проблеме с оборудованием',
  'Запрос на дополнительные материалы',
  'Координация передачи смены'
];
let phIdx = 0;
setInterval(() => {
  phIdx = (phIdx + 1) % placeholders.length;
  document.getElementById('msg-input').placeholder = placeholders[phIdx];
}, 3500);

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderMsg(m, isSystem=false) {
  const mine = m.user_id === currentUserId;
  const cls = isSystem ? 'system' : (mine ? 'mine' : '');
  const time = new Date(m.ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  return `<div class="chat-msg ${cls}">
    <div class="meta">
      <span class="name">${isSystem ? '🤖 СИСТЕМА' : esc(m.full_name)}</span>
      <span class="role">${esc(m.role || '')}</span>
      <span>${time}</span>
    </div>
    <div class="body">${esc(m.text)}</div>
  </div>`;
}

async function loadMessages() {
  try {
    const msgs = await api(`/api/chat/messages?after_id=${lastId}&limit=200`);
    if (msgs.length) {
      const box = document.getElementById('messages');
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
      box.insertAdjacentHTML('beforeend', msgs.map(m=>renderMsg(m,false)).join(''));
      lastId = msgs[msgs.length-1].id;
      if (atBottom) box.scrollTop = box.scrollHeight;
    }
    document.getElementById('chat-status').innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size:.5rem;color:var(--accent-green)"></i>онлайн';
  } catch (e) {
    document.getElementById('chat-status').innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size:.5rem;color:var(--accent-red)"></i>ошибка';
  }
}

function pushSystem(text) {
  const id = 'sys-' + Date.now() + '-' + Math.random();
  if (systemSeen.has(text)) return;
  systemSeen.add(text);
  const box = document.getElementById('messages');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.insertAdjacentHTML('beforeend', renderMsg({ user_id:-1, full_name:'Система', role:'AUTO', ts: Date.now(), text }, true));
  if (atBottom) box.scrollTop = box.scrollHeight;
}

ErpSim.on('replenish', e => pushSystem(`📦 Склад пополнен: ${e.material} +${e.add} шт. (остаток ${e.total})`));
ErpSim.on('defect', l => pushSystem(`⚠️ Брак на партии ${l.id} на этапе ${ErpSim.STAGES[l.stage-1].name}`));
ErpSim.on('complete', l => pushSystem(`✅ Партия ${l.id} полностью изготовлена`));

document.getElementById('send-form').onsubmit = async e => {
  e.preventDefault();
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.disabled = true;
  try { await api('/api/chat/messages', {method:'POST', body: JSON.stringify({text})}); inp.value=''; await loadMessages(); }
  catch (err) { alert(err.message); }
  inp.disabled = false; inp.focus();
};

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('send-form').requestSubmit(); }
});

loadMessages().then(()=> { document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight; });
setInterval(loadMessages, 3000);
</script>
{% endblock %}
